# Preparation only. Never combine with Live compose; no external network or env.
name: lyfe2452
services:
  baseline:
    image: ghcr.io/gitroomhq/postiz-app@sha256:7eb4a553507ce3f200deff2ec0211ab3cf834ba19eb44dd68e83ccc236509feb
    container_name: lyfe2452-baseline
    pull_policy: never
    entrypoint: []
    command: [sh, -c, "nginx && pm2 ping && pnpm --filter postiz-frontend run pm2 && pnpm --filter postiz-backend run pm2 && pnpm --filter postiz-orchestrator run pm2 && pm2 logs"]
    mem_limit: 4608m
    memswap_limit: 4608m
    cpus: 2
    restart: "no"
    environment:
      MAIN_URL: http://127.0.0.1:4052
      FRONTEND_URL: http://127.0.0.1:4052
      BACKEND_INTERNAL_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_BACKEND_URL: http://127.0.0.1:4052/api
      JWT_SECRET: synthetic-rehearsal-no-live-sessions
      DATABASE_URL: postgresql://rehearsal:synthetic-only@postgres:5432/rehearsal
      REDIS_URL: redis://redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      IS_GENERAL: "true"
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: /uploads
      NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads
      DISABLE_REGISTRATION: "false"
      NOT_SECURED: "true"
      EMAIL_PROVIDER: nodemailer
      EMAIL_HOST: smtp
      EMAIL_PORT: "1025"
      EMAIL_SECURE: "false"
      EMAIL_USER: synthetic-only
      EMAIL_PASS: synthetic-only
      EMAIL_FROM_NAME: LYFE Rehearsal
      EMAIL_FROM_ADDRESS: rehearsal@example.invalid
    volumes:
      - config:/config
      - uploads:/uploads
    ports: ["127.0.0.1:4052:5000"]
    networks: [isolated]
  postgres:
    image: postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    pull_policy: never
    mem_limit: 512m
    environment:
      POSTGRES_USER: rehearsal
      POSTGRES_PASSWORD: synthetic-only
      POSTGRES_DB: rehearsal
    volumes:
      - postgres:/var/lib/postgresql/data
      # Schema-only reviewed SQL. No Live rows, migrations or Prisma schema push.
      - type: bind
        source: ${REHEARSAL_SCHEMA_SQL:?Set the private schema-only fixture path}
        target: /docker-entrypoint-initdb.d/00-schema.sql
        read_only: true
        bind:
          create_host_path: false
    networks: [isolated]
  redis:
    image: redis@sha256:29e8589c3f9ba699b5f7aa4b3c7733c58852a3626439e619aa0ee78de08c6ca0
    pull_policy: never
    mem_limit: 128m
    networks: [isolated]
  temporal-postgresql:
    image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    pull_policy: never
    mem_limit: 512m
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: synthetic-only
    volumes: ["temporal-db:/var/lib/postgresql/data"]
    networks: [isolated]
  temporal:
    image: temporalio/auto-setup@sha256:607d68caa111338d754771efb876c92dfcdae06d056e4530bb31cd0f37406e6a
    pull_policy: never
    mem_limit: 1024m
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: synthetic-only
      POSTGRES_SEEDS: temporal-postgresql
      ENABLE_ES: "false"
      TEMPORAL_NAMESPACE: default
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/docker.yaml
      SKIP_ADD_CUSTOM_SEARCH_ATTRIBUTES: "true"
    volumes:
      - type: bind
        source: ./temporal.dynamicconfig.yml
        target: /etc/temporal/config/dynamicconfig/docker.yaml
        read_only: true
    networks: [isolated]
  smtp:
    image: axllent/mailpit@sha256:030f06031ce5c60913ac9363da1ab0d4be6fd2a78147dd0e1ca0fcac665d6b34
    pull_policy: never
    mem_limit: 64m
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    networks: [isolated]
volumes:
  config: {name: lyfe2452-config}
  uploads: {name: lyfe2452-uploads}
  postgres: {name: lyfe2452-postgres}
  temporal-db: {name: lyfe2452-temporal-db}
networks:
  isolated:
    name: lyfe2452-isolated
    internal: true
